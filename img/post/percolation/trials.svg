<svg xmlns="http://www.w3.org/2000/svg" width="720" height="670" viewBox="0 0 720 670" role="img" aria-labelledby="title desc"><title id="title">Many seed trials</title><desc id="desc">Separate trials use disjoint fresh entrance and seed edges. Two successes become attached to the incoming cluster; other trials fail.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#617581"/></marker></defs><rect width="720" height="670" rx="16" fill="#fafbf8"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="46" fill="#243b48" font-size="27" text-anchor="start" font-weight="700">Pay for rare seeds with many attempts</text><rect x="302" y="105" width="375" height="437" rx="4" fill="#eaf3fd" stroke="#347bc0" stroke-width="2"/><text x="483" y="580" fill="#347bc0" font-size="23" text-anchor="middle" font-weight="500">Inside the selected layer</text><path d="M49 320 H155 V149 M155 320 V493" fill="none" stroke="#8651a0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="37" y="637" fill="#617581" font-size="23" text-anchor="start" font-weight="500">The incoming cluster is already connected outside.</text><path d="M155 147 H284" fill="none" stroke="#8651a0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="322" y="119" width="64" height="56" rx="2" fill="#f3f4f3" stroke="#a1b0b8" stroke-width="2"/><path d="M284 147 H322" fill="none" stroke="#a1b0b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5"/><path d="M295 139 L311 155" fill="none" stroke="#bf5262" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="418" y="154" fill="#617581" font-size="23" text-anchor="start" font-weight="500">Entrance closed</text><path d="M155 231 H284" fill="none" stroke="#8651a0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="322" y="203" width="64" height="56" rx="2" fill="#fff0c6" stroke="#c99020" stroke-width="2"/><path d="M284 231 H322" fill="none" stroke="#078779" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M322 231 H386 M343 203 V259 M365 203 V259" fill="none" stroke="#c99020" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="418" y="238" fill="#078779" font-size="23" text-anchor="start" font-weight="500">Attached open seed</text><path d="M155 315 H284" fill="none" stroke="#8651a0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="322" y="287" width="64" height="56" rx="2" fill="#f3f4f3" stroke="#a1b0b8" stroke-width="2"/><path d="M284 315 H342" fill="none" stroke="#078779" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M342 315 H359" fill="none" stroke="#bf5262" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><text x="418" y="322" fill="#617581" font-size="23" text-anchor="start" font-weight="500">Seed incomplete</text><path d="M155 399 H284" fill="none" stroke="#8651a0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="322" y="371" width="64" height="56" rx="2" fill="#f3f4f3" stroke="#a1b0b8" stroke-width="2"/><path d="M284 399 H322" fill="none" stroke="#a1b0b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5"/><path d="M295 391 L311 407" fill="none" stroke="#bf5262" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="418" y="406" fill="#617581" font-size="23" text-anchor="start" font-weight="500">Entrance closed</text><path d="M155 483 H284" fill="none" stroke="#8651a0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="322" y="455" width="64" height="56" rx="2" fill="#fff0c6" stroke="#c99020" stroke-width="2"/><path d="M284 483 H322" fill="none" stroke="#078779" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M322 483 H386 M343 455 V