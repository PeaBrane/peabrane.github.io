<svg xmlns="http://www.w3.org/2000/svg" width="720" height="610" viewBox="0 0 720 610" role="img" aria-labelledby="title desc"><title id="title">A seed and a prescribed patch</title><desc id="desc">Left: a seed touches a path leaving its surrounding box. Right: a crossing reaches a fixed inward half-edge. An inset shows a quarter of a three-dimensional face.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#617581"/></marker></defs><rect width="720" height="610" rx="16" fill="#fafbf8"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="46" fill="#243b48" font-size="27" text-anchor="start" font-weight="700">Touch infinity, then aim for a patch</text><text x="35" y="96" fill="#617581" font-size="22" text-anchor="start" font-weight="500">A piece of the infinite cluster</text><rect x="65" y="126" width="220" height="215" rx="0" fill="#fff" stroke="#a1b0b8" stroke-width="3"/><rect x="151" y="208" width="48" height="48" rx="2" fill="#fff0c6" stroke="#c99020" stroke-width="3"/><path d="M151,232 H199 M175,208 V256" fill="none" stroke="#c99020" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M161 238 L185 219 L216 233 L228 196 L266 182 L275 145 L300 129 L327 92" fill="none" stroke="#8651a0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M228 196 L205 170 L181 165" fill="none" stroke="#8651a0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="161" cy="238" r="5" fill="#8651a0"/><text x="175" y="382" fill="#617581" font-size="22" text-anchor="middle" font-weight="500">The seed touches a path</text><text x="175" y="412" fill="#617581" font-size="22" text-anchor="middle" font-weight="500">that keeps going.</text><text x="382" y="96" fill="#617581" font-size="22" text-anchor="start" font-weight="500">A prescribed landing patch</text><rect x="410" y="126" width="220" height="215" rx="0" fill="#fff" stroke="#a1b0b8" stroke-width="3"/><rect x="496" y="208" width="48" height="48" rx="2" fill="#fff0c6" stroke="#c99020" stroke-width="3"/><path d="M496,232 H544 M520,208 V256" fill="none" stroke="#c99020" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505 244 L539 258 L565 240 L586 277 L630 293" fill="none" stroke="#8651a0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M630 234 V341" fill="none" stroke="#078779" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><text x="520" y="382" fill="#617581" font-size="22" text-anchor="middle" font-weight="500">A reliable crossing to</text><text x="520" y="412" fill="#617581" font-size="22" text-anchor="middle" font-weight="500">a patch chosen in advance.</text><rect x="72" y="460" width="116" height="116" rx="0" fill="#eaf3fd" stroke="#347bc0" stroke-width="3"/><rect x="130" y="518" width="58" height="58" rx="0" fill="#dcf2e9" stroke="#078779" stroke-width="3"/><path d="M130 460 V576 M72 518 H188" fill="none" stroke="#a1b0b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="219" y="484" fill="#243b48" font-size="24" text-anchor="start" font-weight="500">In 3D, one square face</text><text x="219" y="515" fill="#243b48" font-size="24" text-anchor="start" font-weight="500">has four quarter-faces.</text><text x="219" y="546" fill="#243b48" font-size="24" text-anchor="start" font-weight="500">Green marks one of them.</text></g></svg>