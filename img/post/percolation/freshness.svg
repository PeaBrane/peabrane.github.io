<svg xmlns="http://www.w3.org/2000/svg" width="720" height="679" viewBox="0 0 720 679" role="img" aria-labelledby="title desc"><title id="title">Preserving fresh information</title><desc id="desc">Before processing a pending box, that box and its next neighbor are fresh. After processing, the neighbor stays hidden; a connection prediction can be calculated without inspecting its edges.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#617581"/></marker></defs><rect width="720" height="679" rx="16" fill="#fafbf8"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="46" fill="#243b48" font-size="27" text-anchor="start" font-weight="700">Keep the next box hidden</text><text x="35" y="101" fill="#617581" font-size="22" text-anchor="start" font-weight="500">Before the current box is processed</text><rect x="244" y="128" width="449" height="235" rx="6" fill="#eef7f1" stroke="#078779" stroke-width="2" stroke-dasharray="8 6"/><text x="465" y="155" fill="#078779" font-size="21" text-anchor="middle" font-weight="500">Fresh region for the relay estimate</text><rect x="36" y="175" width="190" height="146" rx="4" fill="#fcf0e0" stroke="#a46b30" stroke-width="2"/><text x="131" y="211" fill="#243b48" font-size="25" text-anchor="middle" font-weight="500">Parent</text><text x="131" y="290" fill="#a46b30" font-size="23" text-anchor="middle" font-weight="500">Revealed</text><rect x="260" y="175" width="190" height="146" rx="4" fill="#eaf3fd" stroke="#347bc0" stroke-width="2"/><text x="355" y="211" fill="#243b48" font-size="25" text-anchor="middle" font-weight="500">Current</text><text x="355" y="290" fill="#347bc0" font-size="23" text-anchor="middle" font-weight="500">Hidden</text><rect x="484" y="175" width="190" height="146" rx="4" fill="#eaf3fd" stroke="#347bc0" stroke-width="2"/><text x="579" y="211" fill="#243b48" font-size="25" text-anchor="middle" font-weight="500">Next</text><text x="579" y="290" fill="#347bc0" font-size="23" text-anchor="middle" font-weight="500">Hidden</text><path d="M214 249 H274" fill="none" stroke="#617581" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M440 249 H498" fill="none" stroke="#617581" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="35" y="418" fill="#617581" font-size="22" text-anchor="start" font-weight="500">After processing: make a prediction, then queue</text><rect x="36" y="447" width="190" height="146" rx="4" fill="#fcf0e0" stroke="#a46b30" stroke-width="2"/><text x="131" y="483" fill="#243b48" font-size="25" text-anchor="middle" font-weight="500">Parent</text><text x="131" y="560" fill="#a46b30" font-size="23" text-anchor="middle" font-weight="500">Revealed</text><rect x="260" y="447" width="190" height="146" rx="4" fill="#fcf0e0" stroke="#a46b30" stroke-width="2"/><text x="355" y="483" fill="#243b48" font-size="25" text-anchor="middle" font-weight="500">Current</text><text x="355" y="560" fill="#a46b30" font-size="23" text-anchor="middle" font-weight="500">Revealed</text><rect x="484" y="447" width="190" height="146" rx="4" fill="#eaf3fd" stroke="#347bc0" stroke-width="2"/><text x="579" y="483" fill="#243b48" font-size="25" text-anchor="middle" font-weight="500">Next</text><text x="579" y="560" fill="#347bc0" font-size="23" text-anchor="middle" font-weight="500">Still hidden</text><path d="M214 521 H274" fill="none" stroke="#617581" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M440 521 H498" fill="none" stroke="#617581" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 6" marker-end="url(#arrow)"/><text x="360" y="644" fill="#617581" font-size="22" text-anchor="middle" font-weight="500">Reveal the current edges. Predict the next connection.</text></g></svg>