<svg xmlns="http://www.w3.org/2000/svg" width="720" height="744" viewBox="0 0 720 744" role="img" aria-labelledby="title desc"><title id="title">Three target contractions</title><desc id="desc">Four cuboids show the target shrinking in one coordinate at a time. Target centers do not move during contraction; diagrams are separated for comparison.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#617581"/></marker></defs><rect width="720" height="744" rx="16" fill="#fafbf8"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="46" fill="#243b48" font-size="27" text-anchor="start" font-weight="700">Three contractions make room to travel</text><path d="M70 177 l40 -40 h180 v150 l-40 40 H70 Z" fill="#eaf3fd" stroke="#347bc0" stroke-width="3"/><path d="M70 177 h180 v150 M250 177 l40 -40" fill="none" stroke="#347bc0" stroke-width="2"/><circle cx="180" cy="232" r="5" fill="#8651a0"/><text x="171" y="379" fill="#243b48" font-size="23" text-anchor="middle" font-weight="500">Start: full inner target</text><path d="M448 177 l40 -40 h110 v150 l-40 40 H448 Z" fill="#eaf3fd" stroke="#347bc0" stroke-width="3"/><path d="M448 177 h110 v150 M558 177 l40 -40" fill="none" stroke="#347bc0" stroke-width="2"/><circle cx="523" cy="232" r="5" fill="#8651a0"/><text x="533" y="379" fill="#243b48" font-size="23" text-anchor="middle" font-weight="500">1. Narrow one direction</text><path d="M448 466 l20 -20 h110 v150 l-20 20 H448 Z" fill="#eaf3fd" stroke="#347bc0" stroke-width="3"/><path d="M448 466 h110 v150 M558 466 l20 -20" fill="none" stroke="#347bc0" stroke-width="2"/><circle cx="513" cy="531" r="5" fill="#8651a0"/><text x="533" y="662" fill="#243b48" font-size="23" text-anchor="middle" font-weight="500">2. Narrow the second</text><path d="M120 498 l20 -20 h110 v90 l-20 20 H120 Z" fill="#eaf3fd" stroke="#347bc0" stroke-width="3"/><path d="M120 498 h110 v90 M230 498 l20 -20" fill="none" stroke="#347bc0" stroke-width="2"/><circle cx="185" cy="533" r="5" fill="#8651a0"/><text x="171" y="662" fill="#243b48" font-size="23" text-anchor="middle" font-weight="500">3. Narrow the third</text><path d="M314 247 H406" fill="none" stroke="#617581" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M535 393 V427" fill="none" stroke="#617581" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M406 546 H296" fill="none" stroke="#617581" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="360" y="710" fill="#617581" font-size="23" text-anchor="middle" font-weight="500">Each step asks the cluster to reach a smaller target.</text></g></svg>