<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="500" height="681" viewBox="0 0 500 681" role="img" aria-label="roadmap"><title>roadmap</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#203644"/></marker></defs><rect width="500" height="681" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><rect x="20" y="20" width="210" height="128" rx="5" stroke="#df9600" stroke-width="2" fill="#fff1c6"/><text x="125" y="49" font-size="19" fill="#577080" text-anchor="middle">01</text><text x="125" y="86" font-size="22" fill="#203644" text-anchor="middle">Seed reaches</text><text x="125" y="114" font-size="22" fill="#203644" text-anchor="middle">a patch</text><rect x="270" y="20" width="210" height="128" rx="5" stroke="#df9600" stroke-width="2" fill="#fff1c6"/><text x="375" y="49" font-size="19" fill="#577080" text-anchor="middle">02</text><text x="375" y="86" font-size="22" fill="#203644" text-anchor="middle">Preserve it just</text><text x="375" y="114" font-size="22" fill="#203644" text-anchor="middle">below criticality</text><rect x="270" y="190" width="210" height="128" rx="5" stroke="#df9600" stroke-width="2" fill="#fff1c6"/><text x="375" y="219" font-size="19" fill="#577080" text-anchor="middle">03</text><text x="375" y="256" font-size="22" fill="#203644" text-anchor="middle">Buffer supplies</text><text x="375" y="284" font-size="22" fill="#203644" text-anchor="middle">entrances</text><rect x="20" y="190" width="210" height="128" rx="5" stroke="#df9600" stroke-width="2" fill="#fff1c6"/><text x="125" y="219" font-size="19" fill="#577080" text-anchor="middle">04</text><text x="125" y="256" font-size="22" fill="#203644" text-anchor="middle">Many small</text><text x="125" y="284" font-size="22" fill="#203644" text-anchor="middle">seed attempts</text><rect x="20" y="360" width="210" height="128" rx="5" stroke="#2d7cce" stroke-width="2" fill="#eaf3fd"/><text x="125" y="389" font-size="19" fill="#577080" text-anchor="middle">05</text><text x="125" y="426" font-size="22" fill="#203644" text-anchor="middle">Glue through a</text><text x="125" y="454" font-size="22" fill="#203644" text-anchor="middle">reliable seed</text><rect x="270" y="360" width="210" height="128" rx="5" stroke="#2d7cce" stroke-width="2" fill="#eaf3fd"/><text x="375" y="389" font-size="19" fill="#577080" text-anchor="middle">06</text><text x="375" y="426" font-size="22" fill="#203644" text-anchor="middle">Shrink, then</text><text x="375" y="454" font-size="22" fill="#203644" text-anchor="middle">move the target</text><rect x="270" y="530" width="210" height="128" rx="5" stroke="#2d7cce" stroke-width="2" fill="#eaf3fd"/><text x="375" y="559" font-size="19" fill="#577080" text-anchor="middle">07</text><text x="375" y="596" font-size="22" fill="#203644" text-anchor="middle">Explore fresh</text><text x="375" y="624" font-size="22" fill="#203644" text-anchor="middle">boxes</text><rect x="20" y="530" width="210" height="128" rx="5" stroke="#2d7cce" stroke-width="2" fill="#eaf3fd"/><text x="125" y="559" font-size="19" fill="#577080" text-anchor="middle">08</text><text x="125" y="596" font-size="22" fill="#203644" text-anchor="middle">Rule out a</text><text x="125" y="624" font-size="22" fill="#203644" text-anchor="middle">stopping ring</text><path d="M236 84 H264" stroke="#203644" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" fill="none" marker-end="url(#arrow)"/><path d="M375 155 V182" stroke="#203644" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" fill="none" marker-end="url(#arrow)"/><path d="M264 254 H236" stroke="#203644" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" fill="none" marker-end="url(#arrow)"/><path d="M125 325 V352" stroke="#203644" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" fill="none" marker-end="url(#arrow)"/><path d="M236 424 H264" stroke="#203644" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" fill="none" marker-end="url(#arrow)"/><path d="M375 495 V522" stroke="#203644" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" fill="none" marker-end="url(#arrow)"/><path d="M264 594 H236" stroke="#203644" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" fill="none" marker-end="url(#arrow)"/></g></svg>