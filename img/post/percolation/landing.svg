<svg xmlns="http://www.w3.org/2000/svg" width="720" height="676" viewBox="0 0 720 676" role="img" aria-labelledby="title desc"><title id="title">A patch that fits near a corner</title><desc id="desc">Two-dimensional slices: a full forward edge protrudes above the target, while its lower inward half is entirely inside. An inset shows the quarter-face in three dimensions.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#617581"/></marker></defs><rect width="720" height="676" rx="16" fill="#fafbf8"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="46" fill="#243b48" font-size="27" text-anchor="start" font-weight="700">Choose the patch that points inward</text><text x="37" y="98" fill="#617581" font-size="22" text-anchor="start" font-weight="500">Full forward edge</text><text x="385" y="98" fill="#617581" font-size="22" text-anchor="start" font-weight="500">Inward half-edge</text><rect x="37" y="205" width="281" height="225" rx="3" fill="#eaf3fd" stroke="#347bc0" stroke-width="2"/><rect x="67" y="125" width="220" height="220" rx="0" fill="none" stroke="#a1b0b8" stroke-width="3" stroke-dasharray="8 5"/><rect x="164" y="222" width="26" height="26" rx="2" fill="#fff0c6" stroke="#c99020" stroke-width="3"/><path d="M164,235 H190 M177,222 V248" fill="none" stroke="#c99020" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="178" y="468" fill="#347bc0" font-size="23" text-anchor="middle" font-weight="500">Next target</text><rect x="385" y="205" width="281" height="225" rx="3" fill="#eaf3fd" stroke="#347bc0" stroke-width="2"/><rect x="415" y="125" width="220" height="220" rx="0" fill="none" stroke="#a1b0b8" stroke-width="3" stroke-dasharray="8 5"/><rect x="512" y="222" width="26" height="26" rx="2" fill="#fff0c6" stroke="#c99020" stroke-width="3"/><path d="M512,235 H538 M525,222 V248" fill="none" stroke="#c99020" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="526" y="468" fill="#347bc0" font-size="23" text-anchor="middle" font-weight="500">Next target</text><path d="M287 125 V205" fill="none" stroke="#bf5262" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M287 205 V345" fill="none" stroke="#a1b0b8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="278" y="157" fill="#bf5262" font-size="21" text-anchor="end" font-weight="500">Outside</text><path d="M635 235 V345" fill="none" stroke="#078779" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M568 163 V213" fill="none" stroke="#617581" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="48" y="520" width="118" height="118" rx="0" fill="#eaf3fd" stroke="#347bc0" stroke-width="3"/><rect x="107" y="579" width="59" height="59" rx="0" fill="#dcf2e9" stroke="#078779" stroke-width="3"/><path d="M107 520 V638 M48 579 H166" fill="none" stroke="#a1b0b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="204" y="548" fill="#243b48" font-size="24" text-anchor="start" font-weight="500">In three dimensions, choose</text><text x="204" y="579" fill="#243b48" font-size="24" text-anchor="start" font-weight="500">the inward half in both sideways</text><text x="204" y="610" fill="#243b48" font-size="24" text-anchor="start" font-weight="500">directions: one quarter-face.</text></g></svg>