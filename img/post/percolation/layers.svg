<svg xmlns="http://www.w3.org/2000/svg" width="720" height="730" viewBox="0 0 720 730" role="img" aria-labelledby="title desc"><title id="title">Nested layers and sealed gates</title><desc id="desc">Reachable entrances on a fixed layer; below, closing all reachable gates on an outer layer blocks the source from every inner layer.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#617581"/></marker></defs><rect width="720" height="730" rx="16" fill="#fafbf8"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="46" fill="#243b48" font-size="27" text-anchor="start" font-weight="700">Many layers share one blocking budget</text><text x="36" y="96" fill="#617581" font-size="22" text-anchor="start" font-weight="500">Reachable gates on one candidate layer</text><rect x="150" y="130" width="470" height="240" rx="0" fill="none" stroke="#a1b0b8" stroke-width="2" stroke-dasharray="6 6"/><rect x="185" y="160" width="400" height="180" rx="0" fill="none" stroke="#a1b0b8" stroke-width="2" stroke-dasharray="6 6"/><rect x="220" y="188" width="330" height="124" rx="0" fill="none" stroke="#a1b0b8" stroke-width="2" stroke-dasharray="6 6"/><rect x="308" y="225" width="155" height="53" rx="4" fill="#fcf0e0" stroke="#a46b30" stroke-width="2"/><text x="385" y="259" fill="#a46b30" font-size="23" text-anchor="middle" font-weight="500">Target</text><path d="M40 252 H92 L125 180 H185 M92 252 L129 247 H185 M92 252 L123 327 H185" fill="none" stroke="#8651a0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="185" cy="180" r="7" fill="#078779"/><circle cx="185" cy="247" r="7" fill="#078779"/><circle cx="185" cy="327" r="7" fill="#078779"/><path d="M185 160 V340" fill="none" stroke="#078779" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="362" y="405" fill="#617581" font-size="23" text-anchor="middle" font-weight="500">First expose paths outside the chosen layer.</text><rect x="150" y="466" width="470" height="162" rx="0" fill="none" stroke="#a1b0b8" stroke-width="2" stroke-dasharray="6 6"/><rect x="220" y="493" width="330" height="110" rx="0" fill="none" stroke="#a1b0b8" stroke-width="2" stroke-dasharray="6 6"/><rect x="308" y="523" width="155" height="50" rx="4" fill="#fcf0e0" stroke="#a46b30" stroke-width="2"/><text x="385" y="556" fill="#a46b30" font-size="23" text-anchor="middle" font-weight="500">Target</text><path d="M40 547 H111 L150 492 M111 547 H150 M111 547 L150 603" fill="none" stroke="#8651a0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M141 483 L159 501 M141 501 L159 483" fill="none" stroke="#bf5262" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M141 538 L159 556 M141 556 L159 538" fill="none" stroke="#bf5262" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M141 594 L159 612 M141 612 L159 594" fill="none" stroke="#bf5262" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="360" y="674" fill="#617581" font-size="23" text-anchor="middle" font-weight="500">Seal every reachable gate:</text><text x="360" y="704" fill="#617581" font-size="23" text-anchor="middle" font-weight="500">the inner layers cannot be reached.</text></g></svg>