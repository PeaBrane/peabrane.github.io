<svg xmlns="http://www.w3.org/2000/svg" width="720" height="636" viewBox="0 0 720 636" role="img" aria-labelledby="title desc"><title id="title">Ten translations between coarse boxes</title><desc id="desc">Ten shifts carry a contracted target toward a neighboring box. Targets grow slightly during translation; the final green target still fits inside the standard inner target.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#617581"/></marker></defs><rect width="720" height="636" rx="16" fill="#fafbf8"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="46" fill="#243b48" font-size="27" text-anchor="start" font-weight="700">Then ten moves into the neighboring box</text><rect x="34" y="138" width="324" height="292" rx="3" fill="#fff" stroke="#a1b0b8" stroke-width="2"/><rect x="362" y="138" width="324" height="292" rx="3" fill="#fff" stroke="#a1b0b8" stroke-width="2"/><rect x="110" y="202" width="166" height="165" rx="0" fill="none" stroke="#347bc0" stroke-width="2" stroke-dasharray="7 6"/><rect x="442" y="202" width="166" height="165" rx="0" fill="none" stroke="#347bc0" stroke-width="2" stroke-dasharray="7 6"/><rect x="188.7" y="246.5" width="75" height="75" rx="0" fill="none" stroke="#aec1c8" stroke-width="1.5"/><rect x="220.39999999999998" y="245" width="78" height="78" rx="0" fill="none" stroke="#aec1c8" stroke-width="1.5"/><rect x="252.10000000000002" y="243.5" width="81" height="81" rx="0" fill="none" stroke="#aec1c8" stroke-width="1.5"/><rect x="283.8" y="242" width="84" height="84" rx="0" fill="none" stroke="#aec1c8" stroke-width="1.5"/><rect x="315.5" y="240.5" width="87" height="87" rx="0" fill="none" stroke="#aec1c8" stroke-width="1.5"/><rect x="347.2" y="239" width="90" height="90" rx="0" fill="none" stroke="#aec1c8" stroke-width="1.5"/><rect x="378.9" y="237.5" width="93" height="93" rx="0" fill="none" stroke="#aec1c8" stroke-width="1.5"/><rect x="410.6" y="236" width="96" height="96" rx="0" fill="none" stroke="#aec1c8" stroke-width="1.5"/><rect x="442.3" y="234.5" width="99" height="99" rx="0" fill="none" stroke="#aec1c8" stroke-width="1.5"/><rect x="157" y="248" width="72" height="72" rx="2" fill="#eee5f2" stroke="#8651a0" stroke-width="3"/><rect x="474" y="233" width="102" height="102" rx="2" fill="#dcf2e9" stroke="#078779" stroke-width="3"/><path d="M193 284 H525" fill="none" stroke="#617581" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="193" cy="284" r="5" fill="#8651a0"/><circle cx="525" cy="284" r="5" fill="#078779"/><text x="193" y="475" fill="#617581" font-size="23" text-anchor="middle" font-weight="500">Current coarse box</text><text x="525" y="475" fill="#617581" font-size="23" text-anchor="middle" font-weight="500">Neighboring coarse box</text><text x="360" y="529" fill="#617581" font-size="23" text-anchor="middle" font-weight="500">Purple: the contracted target at the start.</text><text x="360" y="559" fill="#617581" font-size="23" text-anchor="middle" font-weight="500">Green: the final target fits in the blue dashed box.</text><text x="360" y="589" fill="#617581" font-size="23" text-anchor="middle" font-weight="500">Intermediate targets shift and grow a little.</text></g></svg>