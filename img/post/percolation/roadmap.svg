<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620" role="img" aria-labelledby="title desc"><title id="title">The proof route</title><desc id="desc">Six stages, read along the arrows, from a local seed crossing to infinite growth.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#617581"/></marker></defs><rect width="720" height="620" rx="16" fill="#fafbf8"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="46" fill="#243b48" font-size="27" text-anchor="start" font-weight="700">From one local crossing to infinite growth</text><rect x="32" y="85" width="294" height="122" rx="12" fill="#fff0c6" stroke="#c99020" stroke-width="2"/><text x="50" y="117" fill="#c99020" font-size="22" text-anchor="start" font-weight="700">1</text><text x="50" y="150" fill="#243b48" font-size="23" text-anchor="start" font-weight="500">A seed reaches</text><text x="50" y="180" fill="#243b48" font-size="23" text-anchor="start" font-weight="500">a prescribed patch</text><rect x="394" y="85" width="294" height="122" rx="12" fill="#fcf0e0" stroke="#a46b30" stroke-width="2"/><text x="412" y="117" fill="#a46b30" font-size="22" text-anchor="start" font-weight="700">2</text><text x="412" y="150" fill="#243b48" font-size="23" text-anchor="start" font-weight="500">A buffer supplies</text><text x="412" y="180" fill="#243b48" font-size="23" text-anchor="start" font-weight="500">many entrances</text><rect x="394" y="250" width="294" height="122" rx="12" fill="#dcf2e9" stroke="#078779" stroke-width="2"/><text x="412" y="282" fill="#078779" font-size="22" text-anchor="start" font-weight="700">3</text><text x="412" y="315" fill="#243b48" font-size="23" text-anchor="start" font-weight="500">Open seeds attach;</text><text x="412" y="345" fill="#243b48" font-size="23" text-anchor="start" font-weight="500">gluing carries on</text><rect x="32" y="250" width="294" height="122" rx="12" fill="#eaf3fd" stroke="#347bc0" stroke-width="2"/><text x="50" y="282" fill="#347bc0" font-size="22" text-anchor="start" font-weight="700">4</text><text x="50" y="315" fill="#243b48" font-size="23" text-anchor="start" font-weight="500">Contract, then move</text><text x="50" y="345" fill="#243b48" font-size="23" text-anchor="start" font-weight="500">to a neighboring box</text><rect x="32" y="415" width="294" height="122" rx="12" fill="#f0eaf5" stroke="#8651a0" stroke-width="2"/><text x="50" y="447" fill="#8651a0" font-size="22" text-anchor="start" font-weight="700">5</text><text x="50" y="480" fill="#243b48" font-size="23" text-anchor="start" font-weight="500">Explore while keeping</text><text x="50" y="510" fill="#243b48" font-size="23" text-anchor="start" font-weight="500">new edges hidden</text><rect x="394" y="415" width="294" height="122" rx="12" fill="#dcf2e9" stroke="#078779" stroke-width="2"/><text x="412" y="447" fill="#078779" font-size="22" text-anchor="start" font-weight="700">6</text><text x="412" y="480" fill="#243b48" font-size="23" text-anchor="start" font-weight="500">Routes keep growing</text><text x="412" y="510" fill="#243b48" font-size="23" text-anchor="start" font-weight="500">past rare bad boxes</text><path d="M340 146 H380" fill="none" stroke="#617581" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M541 219 V237" fill="none" stroke="#617581" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M380 311 H340" fill="none" stroke="#617581" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M179 384 V402" fill="none" stroke="#617581" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M340 476 H380" fill="none" stroke="#617581" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="360" y="586" fill="#617581" font-size="22" text-anchor="middle" font-weight="500">Fix the finite construction. Lower the density. Then grow.</text></g></svg>