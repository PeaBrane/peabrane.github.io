<svg xmlns="http://www.w3.org/2000/svg" width="720" height="633" viewBox="0 0 720 633" role="img" aria-labelledby="title desc"><title id="title">Roles of the regions</title><desc id="desc">A buffer surrounds the current target. A seed is centered in an auxiliary cube. That cube lies inside fresh space and its selected patch lies inside the next target.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#617581"/></marker></defs><rect width="720" height="633" rx="16" fill="#fafbf8"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="46" fill="#243b48" font-size="27" text-anchor="start" font-weight="700">One extension: which region does what?</text><rect x="28" y="82" width="664" height="480" rx="12" fill="#f0f8f3" stroke="#078779" stroke-width="2" stroke-dasharray="10 8"/><text x="50" y="116" fill="#078779" font-size="23" text-anchor="start" font-weight="500">Fresh region</text><rect x="82" y="171" width="320" height="270" rx="4" fill="none" stroke="#a46b30" stroke-width="3" stroke-dasharray="6 7"/><rect x="115" y="205" width="250" height="202" rx="3" fill="#fcf0e0" stroke="#a46b30" stroke-width="3"/><rect x="380" y="232" width="254" height="253" rx="3" fill="#eaf3fd" stroke="#347bc0" stroke-width="3"/><text x="130" y="302" fill="#a46b30" font-size="25" text-anchor="start" font-weight="500">Current</text><text x="130" y="333" fill="#a46b30" font-size="25" text-anchor="start" font-weight="500">target</text><text x="451" y="443" fill="#347bc0" font-size="25" text-anchor="start" font-weight="500">Next target</text><rect x="270" y="135" width="270" height="270" rx="0" fill="none" stroke="#a1b0b8" stroke-width="3" stroke-dasharray="9 6"/><rect x="388" y="253" width="34" height="34" rx="2" fill="#fff0c6" stroke="#c99020" stroke-width="3"/><path d="M388,270 H422 M405,253 V287" fill="none" stroke="#c99020" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M540 270 V405" fill="none" stroke="#078779" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M406 270 L431 286 L451 275 L481 315 L512 303 L540 320" fill="none" stroke="#8651a0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M295 168 L288 134 L231 134" fill="none" stroke="#617581" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="59" y="150" fill="#617581" font-size="22" text-anchor="start" font-weight="500">Auxiliary cube</text><path d="M402 441 L422 475 L387 508" fill="none" stroke="#a46b30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="230" y="535" fill="#617581" font-size="22" text-anchor="start" font-weight="500">Dotted buffer</text><path d="M415 260 L452 186 H528" fill="none" stroke="#c99020" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="450" y="170" fill="#c99020" font-size="22" text-anchor="start" font-weight="500">Small seed</text><path d="M540 338 H658" fill="none" stroke="#078779" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="555" y="370" fill="#078779" font-size="21" text-anchor="start" font-weight="500">Landing</text><text x="555" y="398" fill="#078779" font-size="21" text-anchor="start" font-weight="500">patch</text><text x="360" y="601" fill="#617581" font-size="23" text-anchor="middle" font-weight="500">Cube inside fresh space; patch inside the next target.</text></g></svg>